name: Deriv connectivity probe (temporary)

on:
    push:
        branches:
            - arena/6a261a6d-kiptootrades
        paths:
            - '.github/workflows/deriv-probe.yml'
            - 'scripts/deriv-probe.mjs'
    workflow_dispatch:

permissions:
    contents: write

jobs:
    probe:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: OAuth authorize endpoint — is the redirect allowed?
              run: |
                  exec > >(tee -a probe-output.txt) 2>&1
                  echo "## OAuth authorize probe — $(date -u)"
                  for app in 121856 36300; do
                    echo "================ app_id $app ================"
                    curl -sS -L --max-redirs 5 -o /tmp/out.html -D /tmp/head.txt \
                      -w "final_status=%{http_code} final_url=%{url_effective}\n" \
                      "https://oauth.deriv.com/oauth2/authorize?app_id=$app&l=en&brand=deriv&redirect_uri=https%3A%2F%2Fdylantrades.site%2Fcallback" || true
                    echo "--- redirect chain ---"
                    grep -iE '^(HTTP/|location:)' /tmp/head.txt | head -20
                    echo "--- page hints ---"
                    grep -oiE '(invalid[^<"]{0,120}|redirect_uri[^<"]{0,120}|not registered[^<"]{0,120}|unauthori[^<"]{0,80}|access denied[^<"]{0,80})' /tmp/out.html | head -5
                    echo "--- title ---"
                    grep -oiE '<title>[^<]*</title>' /tmp/out.html | head -2
                  done

            - name: Deriv WebSocket — is the app_id accepted, do ticks flow?
              run: |
                  exec > >(tee -a probe-output.txt) 2>&1
                  echo "## WebSocket probe — $(date -u)"
                  npm install --no-save --no-audit --no-fund ws >/dev/null 2>&1
                  node scripts/deriv-probe.mjs

            - name: Live bundle auth probe
              run: |
                  exec > >(tee -a probe-output.txt) 2>&1
                  chmod +x scripts/bundle-probe.sh
                  bash scripts/bundle-probe.sh

            - name: Commit findings
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  {
                    echo ""
                    echo "_generated by .github/workflows/deriv-probe.yml run ${{ github.run_id }}_"
                  } >> probe-output.txt
                  git add probe-output.txt
                  git commit -m "chore(probe): deriv connectivity findings [skip ci]" || echo "nothing to commit"
                  git push
