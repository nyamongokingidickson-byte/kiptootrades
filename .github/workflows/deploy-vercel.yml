name: Deploy to Vercel

# Publishes the repo to the Vercel project (kiptootrades / dylantrades.site).
# Requires ONE repository secret: VERCEL_TOKEN  (https://vercel.com/account/tokens)
# Optional overrides: VERCEL_ORG_ID, VERCEL_PROJECT_ID — defaults are set below.
#
# Manual runs default to a PREVIEW deployment so a change can be checked before it
# replaces production. Pushes to main deploy straight to production.

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            target:
                description: 'Where to deploy'
                type: choice
                options:
                    - preview
                    - production
                default: preview

concurrency:
    group: vercel-${{ github.event_name == 'push' && 'production' || inputs.target }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    deploy:
        name: Build and deploy
        runs-on: ubuntu-latest
        timeout-minutes: 40
        env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_GcCxHEyleTtU3vsRUkvqia9r' }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_21Hj7hOx209vofPcxVIdW1ebVrAx' }}

        steps:
            - name: Check for VERCEL_TOKEN
              id: token
              env:
                  TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  if [ -z "$TOKEN" ]; then
                      echo "::notice title=Deploy skipped::Add a VERCEL_TOKEN repository secret to enable deploys (see DEPLOY-RUNBOOK.md)."
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "skip=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Resolve target
              id: target
              if: steps.token.outputs.skip != 'true'
              run: |
                  if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.target }}" = "production" ]; then
                      echo "flag=--prod" >> "$GITHUB_OUTPUT"
                      echo "label=production" >> "$GITHUB_OUTPUT"
                  else
                      echo "flag=" >> "$GITHUB_OUTPUT"
                      echo "label=preview" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout
              if: steps.token.outputs.skip != 'true'
              uses: actions/checkout@v4

            - name: Setup Node
              if: steps.token.outputs.skip != 'true'
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install Vercel CLI
              if: steps.token.outputs.skip != 'true'
              run: npm install --global vercel@latest

            - name: Pull Vercel project settings
              if: steps.token.outputs.skip != 'true'
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: vercel pull --yes --environment=${{ steps.target.outputs.label == 'production' && 'production' || 'preview' }} --token="$VERCEL_TOKEN"

            - name: Build (rsbuild -> dist)
              if: steps.token.outputs.skip != 'true'
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: vercel build ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN"

            - name: Deploy
              id: deploy
              if: steps.token.outputs.skip != 'true'
              env:
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  url=$(vercel deploy --prebuilt ${{ steps.target.outputs.flag }} --token="$VERCEL_TOKEN")
                  echo "Deployed (${{ steps.target.outputs.label }}): $url"
                  echo "url=$url" >> "$GITHUB_OUTPUT"

            - name: Summary
              if: steps.token.outputs.skip != 'true'
              run: |
                  {
                      echo "### Deployment (${{ steps.target.outputs.label }})"
                      echo ""
                      echo "- URL: ${{ steps.deploy.outputs.url }}"
                      echo "- Commit: \`${{ github.sha }}\`"
                      echo "- Branch: \`${{ github.ref_name }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"
